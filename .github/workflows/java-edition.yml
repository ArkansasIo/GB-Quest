name: Java Edition

on:
  push:
    paths:
      - "java-launcher/**"
      - "game-metadata.json"
      - ".github/workflows/java-edition.yml"
  pull_request:
    paths:
      - "java-launcher/**"
      - "game-metadata.json"
      - ".github/workflows/java-edition.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build native Java JAR
        run: mvn -B -f java-launcher/pom.xml clean package
      - name: Verify executable manifest
        run: |
          jar tf java-launcher/target/gbquest-java-0.4.0.jar
          unzip -p java-launcher/target/gbquest-java-0.4.0.jar META-INF/MANIFEST.MF | grep -F "Main-Class: io.arkansasio.gbquest.Main"
      - uses: actions/upload-artifact@v4
        with:
          name: gbquest-java-0.4.0
          path: java-launcher/target/gbquest-java-0.4.0.jar
