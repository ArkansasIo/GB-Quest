name: Build 6,000 Asset HD Remaster

on:
  workflow_dispatch:
    inputs:
      size:
        description: HD output dimensions
        required: true
        type: choice
        default: '256'
        options: ['128', '256', '512', '1024']
      tiff:
        description: Include 16-bit/channel TIFF masters
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-art-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image pipeline
        run: python -m pip install --disable-pip-version-check Pillow numpy tifffile
      - name: Generate original 6,000 source sprites
        run: python tools/generate_6000_asset_pack.py --output assets_hd64/gbq_6000 --zip /tmp/GB-Quest-6000-source.zip
      - name: Build HD remasters
        shell: bash
        run: |
          if [ '${{ inputs.tiff }}' = 'true' ]; then
            python tools/remaster_6000_asset_pack.py --source assets_hd64/gbq_6000 --output assets_hd64/gbq_6000_hd --size '${{ inputs.size }}'
          else
            python tools/remaster_6000_asset_pack.py --source assets_hd64/gbq_6000 --output assets_hd64/gbq_6000_hd --size '${{ inputs.size }}' --no-tiff
          fi
      - name: Validate all generated PNG and TIFF files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import tifffile
          root = Path('assets_hd64/gbq_6000_hd')
          report = json.loads((root / 'remaster_report.json').read_text())
          manifest = json.loads((root / 'metadata/asset_manifest.json').read_text())
          assert report['asset_count'] == 6000 == len(manifest)
          for row in manifest:
              p = root / row['path']
              assert p.is_file(), p
              with Image.open(p) as im:
                  assert im.mode == 'RGBA' and im.size == (report['render_size'], report['render_size'])
              if 'master_16bit_path' in row:
                  t = root / row['master_16bit_path']
                  assert t.is_file(), t
                  with tifffile.TiffFile(t) as tf:
                      a = tf.asarray()
                      assert a.dtype.name == 'uint16' and a.shape[-1] == 4, (t, a.shape, a.dtype)
          print('Validated 6,000 PNG remasters and available 16-bit TIFF masters')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GB-Quest-6000-HD-${{ inputs.size }}px
          path: assets_hd64/gbq_6000_hd/
          if-no-files-found: error
          retention-days: 30
