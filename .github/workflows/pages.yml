name: Deploy GitHub Pages

# Publish only the playable browser build. The repository contains large source
# and art archives, so Pages is assembled from the standalone dist outputs.
# Configure Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'client/**'
      - 'assets/**'
      - 'assets_hd/**'
      - 'assets_hd64/**'
      - 'assets_citadel/**'
      - 'tools/build.cjs'
      - 'tools/build_atlas.py'
      - 'dist/atlas.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone game
        run: node tools/build.cjs

      - name: Assemble and verify site
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/gbquest.html
          test -s dist/gbquest-fullscreen.html
          test -s dist/atlas.html
          mkdir -p _site/dist
          cp dist/gbquest.html            _site/index.html
          cp dist/gbquest-fullscreen.html _site/fullscreen.html
          cp dist/atlas.html              _site/atlas.html
          # Keep the atlas fallback path available under the project Pages URL.
          cp dist/atlas.html              _site/dist/atlas.html
          cp 404.html                     _site/404.html
          touch _site/.nojekyll

          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('_site/index.html', 'utf8');
          const full = fs.readFileSync('_site/fullscreen.html', 'utf8');
          const atlas = fs.readFileSync('_site/atlas.html', 'utf8');
          for (const [name, content] of [['index', html], ['fullscreen', full], ['atlas', atlas]]) {
            if (!content.includes('Lost Kingdom of Shadowbane Chronicles') && name !== 'atlas') {
              throw new Error(`Pages ${name}.html is missing the game title`);
            }
          }
          for (const marker of ['window.GB_ASSETS=', 'window.GBQ_HD64_ATLASES=', 'wow_raid_map']) {
            if (!html.includes(marker)) throw new Error(`Pages game build is missing ${marker}`);
          }
          if (!fs.existsSync('_site/dist/atlas.html')) throw new Error('Pages atlas fallback is missing');
          if (!fs.existsSync('_site/404.html')) throw new Error('Pages 404 document is missing');
          console.log('Pages smoke check passed: game bundle, HD64 atlases, raid map, fullscreen, atlas and 404 are present.');
          NODE

          du -sh _site
          size=$(du -sb _site | cut -f1)
          if [ "$size" -ge 1000000000 ]; then
            echo "Pages site exceeds GitHub Pages 1 GB limit: $size bytes" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
