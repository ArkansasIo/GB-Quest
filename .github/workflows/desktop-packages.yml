name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund
      - name: Build the game bundle
        run: node tools/build.cjs
      - name: Package Windows installer and portable app
        if: matrix.platform == 'windows'
        run: npm run desktop:dist -- --win
      - name: Include the self-contained game patch
        if: matrix.platform == 'windows'
        run: Copy-Item dist/gbquest-fullscreen.html release/gbquest-fullscreen.html
      - name: Package macOS Intel and Apple Silicon apps
        if: matrix.platform == 'macos'
        run: npm run desktop:dist -- --mac
      - uses: actions/upload-artifact@v4
        with:
          name: shadowbane-chronicles-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shadowbane-chronicles-*
          path: release
          merge-multiple: true
      - name: Create update manifest
        run: node tools/write-game-update-manifest.cjs release/gbquest-fullscreen.html release/game-update.json
      - name: Publish desktop installers and game patch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Shadowbane Chronicles $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/gbquest-fullscreen.html release/game-update.json release/*.exe release/*.dmg release/*.zip --clobber
