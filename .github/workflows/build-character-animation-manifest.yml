name: Build Character Animation Manifest

on:
  workflow_dispatch:
    inputs:
      frame_size:
        description: "Animation frame canvas size"
        required: true
        type: choice
        options: ["64", "128", "256", "512"]
        default: "128"
      archetype:
        description: "Prototype archetype to generate"
        required: true
        type: choice
        options: ["warrior", "mage", "ranger", "rogue", "cleric", "summoner"]
        default: "warrior"
      rank:
        description: "Prototype rank to generate"
        required: true
        type: choice
        options: ["F", "E", "D", "C", "B", "A", "S", "SS", "SSS"]
        default: "F"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate animation manifest
        run: |
          python tools/build_animation_manifest.py \
            --output assets_hd64/animations \
            --frame-size "${{ inputs.frame_size }}"
      - name: Generate selected archetype/rank prototype frames
        run: |
          python -m pip install Pillow
          python tools/generate_character_sprite_pack.py \
            --output assets_hd64/animations/frames \
            --size "${{ inputs.frame_size }}" \
            --archetypes "${{ inputs.archetype }}" \
            --ranks "${{ inputs.rank }}"
      - name: Generate equipment overlay layers
        run: |
          python tools/generate_equipment_layers.py \
            --output assets_hd64/equipment \
            --size "${{ inputs.frame_size }}" \
            --ranks "${{ inputs.rank }}"
      - name: Validate catalog equipment visual mappings
        run: |
          python tools/validate_equipment_visual_map.py \
            --catalog src/mmorpg/data/equipment.json \
            --mapping data/visuals/equipment-catalog-visual-map.json \
            --manifest assets_hd64/equipment/equipment_manifest.json \
            --rank "${{ inputs.rank }}"
      - name: Build an equipped character preview
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("assets_hd64/equipment/preview_loadout.json").write_text(json.dumps({
              "head": "iron_helm", "chest": "iron_plate",
              "main_hand": "iron_sword", "off_hand": "iron_shield",
              "back": "short_cloak"
          }, indent=2))
          PY
          python tools/compose_equipment_preview.py \
            --base "assets_hd64/animations/frames/${{ inputs.archetype }}/${{ inputs.rank }}/S/idle/frame_000.png" \
            --manifest assets_hd64/equipment/equipment_manifest.json \
            --loadout assets_hd64/equipment/preview_loadout.json \
            --rank "${{ inputs.rank }}" --direction S \
            --output assets_hd64/equipment/previews/${{ inputs.archetype }}_${{ inputs.rank }}_S_idle_equipped.png
      - name: Pack directional sprite atlases
        run: |
          python tools/pack_animation_atlases.py \
            --frames assets_hd64/animations/frames \
            --output assets_hd64/animations/atlases \
            --archetype "${{ inputs.archetype }}" \
            --rank "${{ inputs.rank }}" \
            --frame-size "${{ inputs.frame_size }}"
      - name: Validate manifest, frames, and atlases
        env:
          ARCHETYPE: ${{ inputs.archetype }}
          RANK: ${{ inputs.rank }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("assets_hd64/animations/animation_pack_report.json").read_text())
          assert report["sequence_count"] == 3456, report
          assert report["frame_count_target"] == 22032, report
          assert report["artwork_generated"] is False, report
          archetype, rank = os.environ["ARCHETYPE"], os.environ["RANK"]
          frames = list((Path("assets_hd64/animations/frames") / archetype / rank).rglob("frame_*.png"))
          assert len(frames) == 408, f"Expected 408 frames, found {len(frames)}"
          atlas = json.loads(Path("assets_hd64/animations/atlases/atlas_build_report.json").read_text())
          assert atlas["valid"] and len(atlas["sheets"]) == 8, atlas
          variants = json.loads(Path("assets_hd64/animations/character_variant_generation_report.json").read_text())
          assert variants["total_frames"] == 408 and variants["sets"][0]["archetype"] == archetype
          print(f"Validated {len(frames)} frames and {len(atlas['sheets'])} atlases for {archetype}/{rank}")
          PY
      - name: Upload animation artifact
        uses: actions/upload-artifact@v7
        with:
          name: gb-quest-${{ inputs.archetype }}-${{ inputs.rank }}-animation-pack
          path: |
            assets_hd64/animations/
            assets_hd64/equipment/
            data/visuals/equipment-catalog-visual-map.json
          if-no-files-found: error
