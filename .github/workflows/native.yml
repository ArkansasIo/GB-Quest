name: GB Quest native core
on:
  push:
    branches: ["main", "feature/**"]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure assembly-enabled build
        run: cmake -S native -B build/native-asm -DCMAKE_BUILD_TYPE=Release -DGBQ_ENABLE_X86_64_ASM=ON
      - name: Build assembly-enabled core
        run: cmake --build build/native-asm --parallel
      - name: Test assembly-enabled core
        run: ctest --test-dir build/native-asm --output-on-failure
      - name: Configure portable C++23 build
        run: cmake -S native -B build/native-portable -DCMAKE_BUILD_TYPE=Release -DGBQ_ENABLE_X86_64_ASM=OFF
      - name: Build portable core
        run: cmake --build build/native-portable --parallel
      - name: Test portable core
        run: ctest --test-dir build/native-portable --output-on-failure
