name: Lost Kingdom of Shadowbane Chronicles tests
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  javascript-tests:
    name: JavaScript rules and systems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate JavaScript and Python syntax
        run: npm run check:syntax
      - name: Run Node.js test suite
        run: npm test

  native-core:
    name: C++23 native core (portable and x86-64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asm: [OFF, ON]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DGBQ_ENABLE_X86_64_ASM=${{ matrix.asm }}
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure

  desktop-build:
    name: C++23 SDL2 desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL2 and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev
      - name: Configure
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build desktop/build --parallel 2

  asset-pipeline:
    name: Generate pixel-art assets and atlases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install art generator dependencies
        run: python -m pip install --upgrade Pillow numpy
      - name: Generate native 16x16 tiles and 4x/6x HD exports
        run: python tools/gen_gbtiles.py
      - name: Validate high-resolution pixel asset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("assets_hd/gbtiles")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["scales"] == [4, 6], manifest["scales"]
          assets = manifest["assets"]
          assert assets, "High-resolution tile manifest is empty"
          for name, entry in assets.items():
              assert entry["logical_size"] == [16, 16], (name, entry)
              for scale in ("4", "6"):
                  variant = entry["variants"][scale]
                  image = Path(variant["file"])
                  assert image.is_file(), f"Missing {scale}x image: {image}"
                  assert (variant["width"], variant["height"]) == (16 * int(scale),) * 2
          print(f"Validated {len(assets)} pixel assets with {len(assets) * 2} HD variants")
          PY
      - name: Generate rank badges, equipment and UI sprites
        run: python tools/gen_newart.py
      - name: Build enhanced 64-bit atlas pages
        run: python tools/gen_hd64.py
      - name: Test HD64 atlas validator
        run: python3 -m unittest discover -s tests -p 'test_hd64_atlas_validation.py'
      - name: Test directional animation manifest contract
        run: python3 -m unittest discover -s tests -p 'test_animation_manifest.py'
      - name: Validate HD64 atlas manifests and PNG bounds
        run: python tools/validate_hd64_atlases.py --root assets_hd64
      - name: Generate the 6,000-image HD64 source pack
        run: python tools/gen_pack6000_hd.py --output assets_hd64/gbq_6000
      - name: Validate HD64 6,000 asset pack
        run: python tools/validate_pack6000_hd.py --root assets_hd64/gbq_6000
      - name: Build through the Python compatibility entry point
        run: python tools/build.py
      - name: Rebuild through the canonical Node entry point
        run: node tools/build.cjs
      - name: Upload generated art package
        uses: actions/upload-artifact@v7
        with:
          name: gb-quest-generated-art
          path: |
            assets/*.png
            assets_hd64/*.png
            assets_hd64/*.json
            assets_hd/gbtiles/**
            assets/index.json
            dist/gbquest.html
            dist/gbquest-fullscreen.html
          if-no-files-found: error
          retention-days: 14

  mmorpg-integration:
    name: PostgreSQL authoritative MMO integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gbquest_test
          POSTGRES_USER: gbquest
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gbquest -d gbquest_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Apply database schema
        env:
          DATABASE_URL: postgres://gbquest:${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/gbquest_test
        run: npm run mmorpg:migrate
      - name: Exercise HTTP, PostgreSQL and WebSocket gameplay
        env:
          GBQ_TEST_DATABASE_URL: postgres://gbquest:${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/gbquest_test
        run: node --test tests/mmorpg-server.integration.test.js
