name: Lost Kingdom of Shadowbane Chronicles tests
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  javascript-tests:
    name: JavaScript rules and systems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Electron launcher JavaScript
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check src/netlocal.js
          node --check src/rank-system.js
          python3 -m py_compile tools/gen_newart.py tools/gen_gbtiles.py
          node --check client/main.js
          node -e "const fs=require('node:fs'); const html=fs.readFileSync('desktop/launcher.html','utf8'); const script=html.split('<script>')[1]?.split('</script>')[0]; if (!script) throw new Error('Launcher script missing'); new Function(script);"
      - name: Run Node.js test suite
        run: npm test

  native-core:
    name: C++23 native core (portable and x86-64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asm: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DGBQ_ENABLE_X86_64_ASM=${{ matrix.asm }}
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure

  desktop-build:
    name: C++23 SDL2 desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev
      - name: Configure
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build desktop/build --parallel 2

  asset-pipeline:
    name: Generate pixel-art assets and atlases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install art generator dependencies
        run: python -m pip install --upgrade Pillow numpy
      - name: Generate native 16x16 world and dungeon tiles
        run: python tools/gen_gbtiles.py
      - name: Generate rank badges, equipment and UI sprites
        run: python tools/gen_newart.py
      - name: Build enhanced 64-bit atlas pages
        run: python tools/gen_hd64.py
      - name: Validate HD64 6,000 asset pack
        run: python tools/validate_pack6000_hd.py --root assets_hd64/gbq_6000
      - name: Build browser and desktop game bundles
        run: node tools/build.cjs
      - name: Upload generated art package
        uses: actions/upload-artifact@v4
        with:
          name: gb-quest-generated-art
          path: |
            assets/*.png
            assets_hd64/*.png
            assets_hd64/*.json
            assets/index.json
            dist/gbquest.html
            dist/gbquest-fullscreen.html
          if-no-files-found: error
          retention-days: 14
