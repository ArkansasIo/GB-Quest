name: Lost Kingdom of Shadowbane Chronicles tests
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  javascript-tests:
    name: JavaScript rules and systems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Electron launcher JavaScript
        run: node --check desktop/main.cjs && node --check desktop/preload.cjs
      - name: Run Node.js test suite
        run: npm test

  native-core:
    name: C++23 native core (portable and x86-64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asm: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DGBQ_ENABLE_X86_64_ASM=${{ matrix.asm }}
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure

  desktop-build:
    name: C++23 SDL2 desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev
      - name: Configure
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build desktop/build --parallel 2
