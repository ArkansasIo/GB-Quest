name: itch.io Full Source Package

on:
  push:
    branches: [main, feature/mmorpg-server-systems]
    paths:
      - '**'
      - '!README.md'
      - 'tools/package-itch-source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install artwork generator dependency
        run: python -m pip install Pillow
      - name: Generate HD64 character frames and equipment overlays
        run: |
          python tools/build_animation_manifest.py --output assets_hd64/animations --frame-size 128
          python tools/generate_character_sprite_pack.py \
            --output assets_hd64/animations/frames \
            --size 128 \
            --archetypes warrior mage ranger rogue cleric summoner \
            --ranks F
          python tools/generate_equipment_layers.py \
            --output assets_hd64/equipment \
            --size 128 \
            --ranks F
          python tools/validate_equipment_visual_map.py \
            --catalog src/mmorpg/data/equipment.json \
            --mapping data/visuals/equipment-catalog-visual-map.json \
            --manifest assets_hd64/equipment/equipment_manifest.json \
            --rank F
      - name: Build playable HTML5 release
        run: npm run build:itch
      - name: Package complete project source with playable build
        run: python3 tools/package-itch-source.py
      - name: Upload full source package
        uses: actions/upload-artifact@v7
        with:
          name: gbquest-itch-full-source
          path: build/gbquest-itch-full-source.zip
          if-no-files-found: error
          retention-days: 30
