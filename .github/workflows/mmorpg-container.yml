name: MMORPG server container
on:
  pull_request:
    paths:
      - "Dockerfile.mmorpg"
      - "docker-compose.mmorpg.yml"
      - ".dockerignore"
      - ".env.example"
      - "backend/**"
      - "tests/mmorpg-deployment.test.js"
      - "tests/mmorpg-server-security.test.js"
      - "tests/mmorpg-socket-queue.test.js"
      - "package.json"
      - ".github/workflows/mmorpg-container.yml"
  push:
    branches:
      - main
      - "feature/mmorpg-*"
    paths:
      - "Dockerfile.mmorpg"
      - "docker-compose.mmorpg.yml"
      - ".dockerignore"
      - ".env.example"
      - "backend/**"
      - "tests/mmorpg-deployment.test.js"
      - "tests/mmorpg-server-security.test.js"
      - "tests/mmorpg-socket-queue.test.js"
      - "package.json"
      - ".github/workflows/mmorpg-container.yml"

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production server dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Validate server JavaScript
        run: |
          node --check backend/mmorpg-server.cjs
          node --check backend/mmorpg-social-pvp-routes.cjs
          node --check backend/mmorpg-competitive-routes.cjs
          node --check backend/dungeon-matchmaking.cjs
          node --check backend/migrate.cjs
      - name: Run deployment and protocol unit tests
        run: node --test tests/mmorpg-deployment.test.js tests/mmorpg-server-security.test.js tests/mmorpg-socket-queue.test.js
      - name: Validate Compose configuration
        run: |
          printf '%s\\n' 'POSTGRES_PASSWORD=0123456789abcdef0123456789abcdef' 'GBQ_TOKEN_SECRET=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789' > .env.ci
          docker compose --env-file .env.ci -f docker-compose.mmorpg.yml config --quiet
          rm .env.ci
      - name: Build dedicated MMO server image
        run: docker build --file Dockerfile.mmorpg --tag gbquest-mmorpg:ci .
