name: itch.io HTML5 Build

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'src/**'
      - 'assets/**'
      - 'assets_hd64/**'
      - 'assets_citadel/**'
      - 'tools/build.cjs'
      - 'tools/build-itch.cjs'
      - 'package.json'
      - 'game-metadata.json'
      - '.github/workflows/itch-html5.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'src/**'
      - 'assets/**'
      - 'assets_hd64/**'
      - 'assets_citadel/**'
      - 'tools/build.cjs'
      - 'tools/build-itch.cjs'
      - 'package.json'
      - '.github/workflows/itch-html5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build and validate itch.io ZIP
        run: npm run build:itch
      - name: Upload itch.io HTML5 package
        uses: actions/upload-artifact@v7
        with:
          name: gbquest-itch-html5
          path: build/gbquest-itch-html5.zip
          if-no-files-found: error
          retention-days: 30
