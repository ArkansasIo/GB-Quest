  --pk-paper-hi:#ffffff;
  --pk-ink:#202028;
  --pk-muted:#626775;
  --pk-blue:#285da8;
  --pk-blue-hi:#6fa5df;
  --pk-line:#252832;
  --pk-green:#b8d8a0;
}
body.theme-pokemon {
  --pixel:"Silkscreen","Courier New",monospace;
  color:var(--pk-ink) !important;
  background:#aeb6a1 !important;
  font-family:var(--pixel) !important;
}
body.theme-pokemon::before {
  background:repeating-linear-gradient(0deg,#00000008 0 1px,transparent 1px 3px),linear-gradient(135deg,#d4d8c8,#87917d) !important;
}
body.theme-pokemon .build-info {
  color:var(--pk-paper) !important;
  background:var(--pk-blue) !important;
  border-bottom:3px solid var(--pk-ink) !important;
  box-shadow:0 2px 0 #fff inset !important;
  font:9px/1.3 var(--pixel) !important;
  letter-spacing:0 !important;
}
body.theme-pokemon .build-info strong { color:#fff !important; text-shadow:1px 1px 0 #172c52 !important; }
body.theme-pokemon .atlas-btn,
body.theme-pokemon .chat-tabs button,
body.theme-pokemon .chatform button {
  color:var(--pk-ink) !important;
  background:var(--pk-paper) !important;
  border:2px solid var(--pk-line) !important;
  border-radius:2px !important;
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #b6b8b0 !important;
  font:8px var(--pixel) !important;
  letter-spacing:0 !important;
}
body.theme-pokemon .chat-tabs button[aria-pressed="true"] {
  color:#fff !important;
  background:var(--pk-blue) !important;
  border-color:var(--pk-ink) !important;
}
body.theme-pokemon .chat,
body.theme-pokemon .game-viewport > .chat {
  color:var(--pk-ink) !important;
  background:var(--pk-paper) !important;
  border:3px solid var(--pk-ink) !important;
  border-radius:3px !important;
  box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #c7c9c1,4px 4px 0 #0005 !important;
  padding:8px !important;
}
body.theme-pokemon .chat-titlebar {
  color:var(--pk-blue) !important;
  font:9px var(--pixel) !important;
  letter-spacing:0 !important;
  border-bottom:2px solid #c5c8c2;
  padding-bottom:5px;
}
body.theme-pokemon .chat-titlebar button { color:var(--pk-ink) !important; }
body.theme-pokemon .chatlog,
body.theme-pokemon .chatform input {
  color:var(--pk-ink) !important;
  background:#fff !important;
  border:2px solid #777d83 !important;
  border-radius:1px !important;
  font:8px/1.6 var(--pixel) !important;
}
body.theme-pokemon .chatlog b { color:var(--pk-blue) !important; }
body.theme-pokemon .chatform input:focus { outline:2px solid var(--pk-blue) !important; }
body.theme-pokemon .keys {
  color:var(--pk-ink) !important;
  background:var(--pk-paper) !important;
  border-top:2px solid var(--pk-ink) !important;
  font:8px var(--pixel) !important;
}
body.theme-pokemon .keys kbd { color:var(--pk-blue) !important; border:1px solid #7b8188 !important; background:#fff !important; }
body.theme-pokemon #chatShow {
  color:var(--pk-ink) !important;
  background:var(--pk-paper) !important;
  border:3px solid var(--pk-ink) !important;
  border-radius:2px !important;
  box-shadow:2px 2px 0 #0005 !important;
  font:8px var(--pixel) !important;
}
body.theme-pokemon .game-start-fallback {
  color:var(--pk-ink) !important;
  background:var(--pk-paper) !important;
  font:10px/1.7 var(--pixel) !important;
  letter-spacing:0 !important;
}
body.theme-pokemon .game-start-fallback span { color:var(--pk-muted) !important; font:8px/1.7 var(--pixel) !important; }
body.theme-pokemon #lcd { image-rendering:pixelated !important; box-shadow:0 0 0 3px var(--pk-paper),0 0 0 5px var(--pk-ink),5px 5px 0 #0004 !important; }
body.theme-pokemon.full-detail-art #lcd { image-rendering:auto !important; }

/* Pokémon-era menu panels: square corners, high-contrast double frames, no glass or gradients. */
body.theme-pokemon .gbq-player-hud {
  --hud-stone-0:#f8f8ef;
  --hud-stone-1:#ffffff;
  --hud-stone-2:#e5e8e1;
  --hud-brass:#285da8;
  --hud-brass-hi:#173f7b;
  --hud-parchment:#202028;
  --hud-moss:#5e8a48;
  --hud-line:#252832;
  color:var(--pk-ink) !important;
  font:8px/1.45 var(--pixel) !important;
  text-shadow:none !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-panel,
body.theme-pokemon .gbq-player-hud .gbq-hud-hotbar {
  border:3px solid var(--pk-ink) !important;
  border-radius:3px !important;
  padding:6px !important;
  background:var(--pk-paper) !important;
  box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #c6c9c1,3px 3px 0 #0004 !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-panel::before { display:none !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-section-title {
  color:var(--pk-blue) !important;
  border-bottom:2px solid #c7c9c2 !important;
  font:8px var(--pixel) !important;
  letter-spacing:0 !important;
  text-shadow:none !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-section-title span,
body.theme-pokemon .gbq-player-hud .gbq-hud-level,
body.theme-pokemon .gbq-player-hud .gbq-hud-map-meta span,
body.theme-pokemon .gbq-player-hud .gbq-hud-party-data small,
body.theme-pokemon .gbq-player-hud .gbq-hud-stat-grid small,
body.theme-pokemon .gbq-player-hud .gbq-hud-attribute-grid small,
body.theme-pokemon .gbq-player-hud .gbq-hud-quest small { color:var(--pk-muted) !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-brand,
body.theme-pokemon .gbq-player-hud .gbq-hud-player-name,
body.theme-pokemon .gbq-player-hud .gbq-hud-map-meta strong,
body.theme-pokemon .gbq-player-hud .gbq-hud-quest strong,
body.theme-pokemon .gbq-player-hud .gbq-hud-stat-grid strong,
body.theme-pokemon .gbq-player-hud .gbq-hud-attribute-grid strong { color:var(--pk-ink) !important; font:8px var(--pixel) !important; text-shadow:none !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-brand small { color:var(--pk-muted) !important; font:6px var(--pixel) !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-crest,
body.theme-pokemon .gbq-player-hud .gbq-hud-avatar,
body.theme-pokemon .gbq-player-hud .gbq-hud-party-icon {
  color:var(--pk-blue) !important;
  background:#e8eef8 !important;
  border:2px solid var(--pk-ink) !important;
  border-radius:2px !important;
  box-shadow:inset 0 0 0 1px #fff !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-meter {
  border:1px solid var(--pk-ink) !important;
  border-radius:1px !important;
  background:#fff !important;
  color:var(--pk-ink) !important;
  font:6px var(--pixel) !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-meter i { background:#dfe2da !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-meter.hp em { background:#d84a45 !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-meter.mp em { background:#4d8acb !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-meter.xp em { background:#78a85b !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-stat-grid>div,
body.theme-pokemon .gbq-player-hud .gbq-hud-attribute-grid>div {
  background:#fff !important;
  border:1px solid #aeb3ad !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-party-member,
body.theme-pokemon .gbq-player-hud .gbq-hud-quest { border-top:1px solid #c7c9c2 !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-party-data i { background:#dfe2da !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-party-data em { background:#78a85b !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-map-art {
  border:2px solid var(--pk-ink) !important;
  background:#b8d8a0 !important;
  image-rendering:pixelated !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-map-tools { color:var(--pk-blue) !important; font:7px var(--pixel) !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-map-tools button {
  color:var(--pk-ink) !important;
  background:var(--pk-paper) !important;
  border:2px solid var(--pk-ink) !important;
  border-radius:2px !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-nav,
body.theme-pokemon .gbq-player-hud .gbq-hud-hotbar button,
body.theme-pokemon .gbq-player-hud .gbq-hud-quick button,
body.theme-pokemon .gbq-player-hud .gbq-hud-potions button {
  color:var(--pk-ink) !important;
  background:var(--pk-paper) !important;
  border:2px solid var(--pk-ink) !important;
  border-radius:2px !important;
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #c4c7bf !important;
  font:7px var(--pixel) !important;
  text-shadow:none !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-nav:hover,
body.theme-pokemon .gbq-player-hud .gbq-hud-hotbar button:focus-visible { background:#e8eef8 !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-hotbar button small { color:var(--pk-blue) !important; font:6px var(--pixel) !important; }
body.theme-pokemon .gbq-player-hud .gbq-hud-hotbar button .gbq-hud-cooldown {
  color:#fff !important; background:#202028d9 !important; font:7px var(--pixel) !important;
}
body.theme-pokemon .gbq-player-hud .gbq-hud-toast {
  color:var(--pk-ink) !important;
  background:var(--pk-paper) !important;
  border:3px solid var(--pk-ink) !important;
  border-radius:2px !important;
  box-shadow:inset 0 0 0 2px #fff,3px 3px 0 #0005 !important;

@media(max-width:620px) {
  body.theme-pokemon .gbq-player-hud { font-size:7px !important; }
  body.theme-pokemon .gbq-player-hud .gbq-hud-panel { padding:4px !important; }

/* Physical shell: classic grey handheld with a charcoal screen bezel and red/blue controls. */
body.theme-pokemon {
  --room:#9ba58f;
  --shell:#c8cec2;
  --shell-hi:#e2e6dc;
  --shell-lo:#9da69a;
  --bezel:#242832;
  --ring:#285da8;
  --ink:#202028;
  --ink-dim:#626775;
  --btn:#30343b;
  color-scheme:light;
  background:radial-gradient(ellipse at 50% 15%,#d6ddcc 0%,#aab49e 55%,#7d8877 100%) !important;
}
body.theme-pokemon .device {
  background:linear-gradient(145deg,#e2e6dc 0%,#c6ccc0 48%,#a8b0a5 100%) !important;
  border:2px solid #333842 !important;
  border-radius:20px 20px 54px 20px !important;
  box-shadow:inset 0 2px 0 #fff, inset 0 -4px 0 #8b9489, 0 18px 38px #1b251b66 !important;
}
body.theme-pokemon .bezel {
  background:linear-gradient(160deg,#20242b,#343b45 55%,#171b22) !important;
  border:2px solid #20242b !important;
  border-radius:8px !important;
  box-shadow:inset 0 0 0 2px #11151a,0 3px 0 #737b70 !important;
}
body.theme-pokemon .bezel::after { display:none !important; }
body.theme-pokemon .bezel-top { color:#d9e2d3 !important; font:7px var(--pixel) !important; letter-spacing:.08em !important; }
body.theme-pokemon .bezel-top span { background:#6f8e50 !important; }
body.theme-pokemon .brand {
  color:#202028 !important;
  font:700 14px/1.2 var(--pixel) !important;
  letter-spacing:.04em !important;
  text-shadow:1px 1px 0 #fff !important;
}
body.theme-pokemon .brand em { color:#285da8 !important; }
body.theme-pokemon .brand small { color:#626775 !important; font:6px var(--pixel) !important; letter-spacing:.05em !important; }
body.theme-pokemon .round {
  background:radial-gradient(circle at 32% 25%,#ed7771,#bd343d 62%,#79212b) !important;
  color:#fff !important;
  border:2px solid #252832 !important;
  box-shadow:0 3px 0 #202028, inset 0 1px 0 #ffb1a8 !important;
  font:9px var(--pixel) !important;
}
body.theme-pokemon .pill {
  background:linear-gradient(#e6e9e1,#aeb7ab) !important;
  color:#202028 !important;
  border:1px solid #343a42 !important;
  box-shadow:0 2px 0 #555d55 !important;
  font:7px var(--pixel) !important;
}
body.theme-pokemon #dpad::before,
body.theme-pokemon #dpad::after {
  background:#30343b !important;
  box-shadow:inset 1px 1px 0 #666d72,0 2px 0 #15181d !important;
}
body.theme-pokemon #lcd {
  image-rendering:pixelated !important;
  border:3px solid #171b20 !important;
  box-shadow:0 0 0 2px #e6e9e1,0 0 0 4px #343a42,4px 4px 0 #0004 !important;
}
body.theme-pokemon .speaker b { background:#717a70 !important; }
body.theme-pokemon .keys { color:#30343b !important; font:7px var(--pixel) !important; }
body.theme-pokemon .keys kbd { color:#285da8 !important; background:#f8f8ef !important; border:1px solid #747d72 !important; }
body.theme-pokemon .led { background:#8d3636 !important; }
body.theme-pokemon.ready .led { background:#75a84d !important; box-shadow:0 0 8px #75a84d !important; }
body.theme-pokemon .build-info { background:#285da8 !important; border:2px solid #202028 !important; color:#fff !important; }
body.theme-pokemon .build-info strong { color:#fff !important; }

/* The classic theme stays crisp, while full-detail pack art uses smooth sampling. */
body.theme-pokemon.full-detail-art #lcd,
body.theme-pokemon.full-detail-art .gbq-hud-map-art,
body.theme-pokemon.full-detail-art .gbq-hud-avatar .gbq-hud-art,
body.theme-pokemon.full-detail-art .gbq-hud-glyph .gbq-hud-art,
body.theme-pokemon.full-detail-art .gbq-hud-hotbar button > span .gbq-hud-art {
  image-rendering:auto !important;
}
body.theme-pokemon button:focus-visible,
body.theme-pokemon input:focus-visible,
body.theme-pokemon select:focus-visible { outline:2px solid #285da8 !important; outline-offset:2px !important; }
/* Browser shell controls: keep the frame, chat and touch buttons readable around the game canvas. */
body.theme-pokemon .build-info {
  flex-wrap:nowrap;
  gap:8px;
  overflow:hidden;
}
body.theme-pokemon .build-info > span:first-child { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
body.theme-pokemon .build-info > span:not(:first-child) { flex:0 0 auto; white-space:nowrap; }
body.theme-pokemon .game-client { color:var(--pk-ink); }
body.theme-pokemon .chat { font-family:var(--pixel) !important; }
body.theme-pokemon .chat-tabs button:hover,
body.theme-pokemon .atlas-btn:hover,
body.theme-pokemon .chatform button:hover,
body.theme-pokemon .round:hover,
body.theme-pokemon .pill:hover {
  filter:brightness(1.08);
  border-color:var(--pk-blue) !important;
}
body.theme-pokemon .controls .round:active,
body.theme-pokemon .foot .pill:active { transform:translateY(2px); }
body.theme-pokemon #chatHide { min-width:24px; min-height:24px; }
@media(max-width:760px) {
  body.theme-pokemon .build-info { padding-inline:8px; gap:5px; }
  body.theme-pokemon .build-info > span:not(:first-child) { display:none; }
  body.theme-pokemon .build-info .atlas-btn { padding-inline:5px; }
  body.theme-pokemon .controls .round { width:48px; height:48px; }
}
@media(max-width:520px) {
  body.theme-pokemon .device { border-radius:14px 14px 38px 14px !important; padding:12px !important; }
  body.theme-pokemon .brand { font-size:11px !important; }
}
