<style>
/* Full-screen window build: the LCD fills the window (aspect-locked, pixel-crisp);
   touch controls float over the picture on phones; chat is a toggled overlay. */
html, body { height: 100%; overflow: hidden; }
body { background: #000 !important; padding: 0 !important; display: block !important; gap: 0 !important; }
.build-info, .brand, .bezel-top, .keys, .speaker { display: none !important; }
.game-client { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; min-height: 0 !important; max-width: none !important; margin: 0 !important; padding: 0 !important; background: none !important; border: 0 !important; box-shadow: none !important; }
.game-viewport { position: absolute !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; display: grid !important; place-items: center; }
#lcd { display: block; width: min(100vw, calc(100dvh * 160 / 144)) !important; height: auto; max-width: 100vw; max-height: 100dvh; aspect-ratio: 160 / 144; margin: 0; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
body.int #lcd { width: calc(160px * var(--int, 1)) !important; }
.fsbar { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(8px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; opacity: .35; transition: opacity .2s; }
.fsbar:hover, .fsbar:focus-within, body.idle-off .fsbar { opacity: 1; }
.fsbar button { background: #111c; color: #c9d0b0; border: 1px solid #39403a; border-radius: 4px; font: 700 9px "Silkscreen", "Courier New", monospace; padding: 6px 8px; cursor: pointer; letter-spacing: .08em; }
.fsbar button[aria-pressed="true"] { color: #9fd36a; border-color: #7fa52c; }
.chat { position: fixed; z-index: 15; left: max(8px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); width: min(380px, calc(100vw - 16px)) !important; background: #000c; padding: 6px; border-radius: 8px; }
body:not(.chat-on) .chat { display: none; }
.controls, .foot { position: fixed; z-index: 12; left: 0; right: 0; pointer-events: none; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); display: flex !important; justify-content: space-between; }
.foot { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); justify-content: center !important; }
.controls > *, .foot .sys { pointer-events: auto; opacity: .55; }
@media (hover: hover) and (pointer: fine) { body:not(.pad-on) .controls, body:not(.pad-on) .foot { display: none !important; } }
@media (pointer: coarse) and (orientation: portrait) { .controls > *, .foot .sys { opacity: .9; } .controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); } #dpad { transform: scale(1.35); transform-origin: left bottom; } .ab { transform: rotate(-22deg) scale(1.3); transform-origin: right bottom; } .pill { transform: rotate(-22deg) scale(1.3); } .foot { bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); } }
@media (pointer: coarse) { body.pad-off .controls, body.pad-off .foot { display: none !important; } }
</style>
<div class="fsbar" role="toolbar" aria-label="Window">
  <button id="fsPad" title="On-screen pad">PAD</button>
  <button id="fsInt" title="Whole-number pixel scaling">1:1 PIXELS</button>
  <button data-atlas title="World atlas (M)">ATLAS</button>
  <button id="fsChat" title="Chat (C)">CHAT</button>
  <button id="fsFull" title="Full screen (F)">FULL SCREEN</button>
</div>
<script>
(() => {
  const B = document.body, $ = id => document.getElementById(id);
  const pref = k => { try { return localStorage.getItem('gbq.fs.' + k); } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem('gbq.fs.' + k, v); } catch (e) {} };
  const coarse = matchMedia('(pointer: coarse)').matches;
  const fit = () => { const n = Math.max(1, Math.floor(Math.min(innerWidth / 160, innerHeight / 144))); B.style.setProperty('--int', n); };
  addEventListener('resize', fit); fit();
  const tog = (btn, cls, key, on) => { const set = v => { B.classList.toggle(cls, v); btn.setAttribute('aria-pressed', v); save(key, v ? 1 : 0); };
    set(on); btn.onclick = () => set(!B.classList.contains(cls)); return set; };
  const padBtn = $('fsPad');
  if (coarse) tog(padBtn, 'pad-off', 'padoff', pref('padoff') === '1'), padBtn.setAttribute('aria-pressed', !B.classList.contains('pad-off')), padBtn.addEventListener('click', () => padBtn.setAttribute('aria-pressed', !B.classList.contains('pad-off')));
  else tog(padBtn, 'pad-on', 'pad', pref('pad') === '1');
  tog($('fsInt'), 'int', 'int', pref('int') === '1');
  const chat = tog($('fsChat'), 'chat-on', 'chat', pref('chat') === '1');
  const full = $('fsFull'), el = document.documentElement;
  const canFS = !!(el.requestFullscreen || el.webkitRequestFullscreen);
  if (!canFS) full.hidden = true;
  const toggleFS = () => { try { if (typeof applyDisplayMode === 'function') { applyDisplayMode(document.fullscreenElement || document.webkitFullscreenElement ? 'borderless' : 'fullscreen'); return; }
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(() => { full.hidden = true; }); } } catch (e) { full.hidden = true; } };
  full.onclick = toggleFS;
  document.addEventListener('fullscreenchange', () => full.setAttribute('aria-pressed', !!document.fullscreenElement));
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') toggleFS(); else if (e.key === 'c' || e.key === 'C') chat(!B.classList.contains('chat-on')); });
})();
</script>
