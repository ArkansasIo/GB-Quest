services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gbquest
      POSTGRES_USER: gbquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - gbquest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbquest -d gbquest"]
      interval: 5s
      timeout: 3s
      retries: 20
  mmorpg:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATABASE_URL: postgres://gbquest:${POSTGRES_PASSWORD}@db:5432/gbquest
      GBQ_TOKEN_SECRET: ${GBQ_TOKEN_SECRET:?Set GBQ_TOKEN_SECRET in .env}
      GBQ_ALLOWED_ORIGINS: ${GBQ_ALLOWED_ORIGINS:-}
    ports:
      - "8788:8788"
volumes:
  gbquest_pg:
