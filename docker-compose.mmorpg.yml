services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gbquest}
      POSTGRES_USER: ${POSTGRES_USER:-gbquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - gbquest_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gbquest_private

  migrate:
    image: gbquest-mmorpg:local
    build:
      context: .
      dockerfile: Dockerfile.mmorpg
    restart: "no"
    command: ["node", "backend/migrate.cjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbquest}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gbquest}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gbquest_private

  mmo:
    image: gbquest-mmorpg:local
    build:
      context: .
      dockerfile: Dockerfile.mmorpg
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8788
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbquest}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gbquest}
      GBQ_TOKEN_SECRET: ${GBQ_TOKEN_SECRET:?Set GBQ_TOKEN_SECRET in .env}
      GBQ_ALLOWED_ORIGINS: ${GBQ_ALLOWED_ORIGINS:-http://localhost:8788,http://127.0.0.1:8788}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      GBQ_WS_AUTH_TIMEOUT_MS: ${GBQ_WS_AUTH_TIMEOUT_MS:-10000}
      GBQ_WS_HEARTBEAT_MS: ${GBQ_WS_HEARTBEAT_MS:-30000}
      GBQ_WS_MAX_BUFFERED_BYTES: ${GBQ_WS_MAX_BUFFERED_BYTES:-1048576}
    ports:
      - "${MMO_BIND_ADDRESS:-127.0.0.1}:${MMO_PORT:-8788}:8788"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - gbquest_private

volumes:
  gbquest_pg_data:

networks:
  gbquest_private:
    driver: bridge
