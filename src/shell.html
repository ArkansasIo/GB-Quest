<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GB Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one handheld, centred, portrait like the original DMG; controls sized for thumbs. */
:root {
  --room: #121513;        /* desk the device sits on */
  --shell: #2c2f2c;       /* gunmetal body */
  --shell-hi: #3d413c;
  --shell-lo: #1c1e1c;
  --bezel: #161816;
  --ring: #7fa52c;        /* the green ring from the device mockup */
  --ink: #c9d0b0;         /* printed labels */
  --ink-dim: #7c8570;
  --btn: #4a4e48;
  --pixel: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #1b201b 0%, var(--room) 70%);
  color: var(--ink);
  font-family: var(--pixel);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  overflow-x: hidden;
}
.device {
  width: min(100%, 380px);
  background: linear-gradient(160deg, var(--shell-hi), var(--shell) 40%, var(--shell-lo));
  border-radius: 22px 22px 64px 22px;
  padding: 18px 18px 26px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 -4px 0 rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.55);
  display: flex; flex-direction: column; gap: 18px;
}
.bezel {
  background: var(--bezel);
  border-radius: 12px 12px 30px 12px;
  padding: 14px 16px 10px;
  box-shadow: inset 0 0 0 2px #0b0c0b, inset 0 0 0 4px color-mix(in srgb, var(--ring) 55%, transparent);
  display: flex; flex-direction: column; gap: 8px;
}
.bezel-top { display: flex; align-items: center; gap: 8px; font-size: 9px; letter-spacing: .12em; color: var(--ink-dim); }
.led { width: 7px; height: 7px; border-radius: 50%; background: #3a1010; box-shadow: 0 0 0 1px #000; }
body.ready .led { background: #e2402c; box-shadow: 0 0 6px #e2402c; }
.bezel-top span { flex: 1; height: 2px; background: linear-gradient(90deg, var(--ring), transparent); opacity: .6; }
#lcd {
  width: 100%; max-width: 100%; aspect-ratio: 160 / 144;
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #a0a868; border-radius: 3px; display: block;
}
.brand { font-weight: 700; font-size: 15px; letter-spacing: .06em; color: var(--ink); padding-left: 4px; }
.brand em { font-style: normal; color: var(--ring); }
.brand small { font-size: 9px; color: var(--ink-dim); letter-spacing: .14em; }
.controls { display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 4px; }
#dpad {
  position: relative; width: 120px; height: 120px; touch-action: none; cursor: pointer;
  border-radius: 50%; background: radial-gradient(circle, #1f221f 58%, transparent 60%);
}
#dpad::before, #dpad::after {
  content: ""; position: absolute; background: #1a1c1a; border-radius: 6px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 3px 0 #0a0b0a;
}
#dpad::before { left: 40px; top: 10px; width: 40px; height: 100px; }
#dpad::after { left: 10px; top: 40px; width: 100px; height: 40px; }
#dpad i { position: absolute; z-index: 1; width: 0; height: 0; border: 7px solid transparent; opacity: .45; }
#dpad .u { left: 53px; top: 17px; border-bottom-color: var(--ink); }
#dpad .d { left: 53px; bottom: 17px; border-top-color: var(--ink); }
#dpad .l { top: 53px; left: 17px; border-right-color: var(--ink); }
#dpad .r { top: 53px; right: 17px; border-left-color: var(--ink); }
#dpad[data-dir="up"] .u, #dpad[data-dir="down"] .d, #dpad[data-dir="left"] .l, #dpad[data-dir="right"] .r { opacity: 1; }
.ab { justify-self: end; display: flex; gap: 14px; transform: rotate(-22deg); padding-top: 10px; }
.round {
  width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; touch-action: none;
  background: radial-gradient(circle at 35% 30%, #6b7066, var(--btn) 55%, #2d302b);
  box-shadow: 0 4px 0 #111, 0 0 0 3px #1d1f1c; color: var(--ink); font: 700 15px var(--pixel);
  display: grid; place-items: center;
}
.round.down, .pill.down { transform: translateY(3px); box-shadow: 0 1px 0 #111, 0 0 0 3px #1d1f1c; }
.ab .round:nth-child(2) { margin-top: -22px; }
.ab .round span { transform: rotate(22deg); }
.sys { display: flex; justify-content: center; gap: 22px; }
.pill {
  border: 0; cursor: pointer; touch-action: none; background: #1d1f1c; color: var(--ink-dim);
  width: 64px; height: 16px; border-radius: 9px; transform: rotate(-22deg);
  box-shadow: 0 3px 0 #0a0b0a; font: 700 8px var(--pixel); letter-spacing: .12em; position: relative;
}
.round:focus-visible, .pill:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
.speaker { justify-self: end; display: grid; grid-template-columns: repeat(5, 6px); gap: 6px; transform: rotate(-22deg); margin: -6px 8px 0 0; }
.speaker b { height: 30px; border-radius: 3px; background: #151715; box-shadow: inset 0 2px 2px #000; }
.foot { display: flex; justify-content: space-between; align-items: center; }
.keys {
  font: 400 10px/1.7 var(--pixel); color: var(--ink-dim); text-align: center; max-width: 380px; letter-spacing: .04em;
}
.keys kbd { color: var(--ink); font: inherit; border: 1px solid #39403a; border-radius: 3px; padding: 0 4px; }
.chat { width: min(100%, 380px); display: flex; flex-direction: column; gap: 6px; }
.chatlog { height: 92px; overflow-y: auto; background: #0d100e; border: 1px solid #2a302b; border-radius: 6px; padding: 6px 8px;
  font: 400 10px/1.5 var(--pixel); color: var(--ink-dim); letter-spacing: .02em; overflow-wrap: anywhere; }
.chatlog b { font-weight: 700; color: var(--ink); }
.chatlog .ch-say b { color: #9fd7ff; } .chatlog .ch-trade b { color: #f0c860; } .chatlog .ch-lfg b { color: #ff9f7a; }
.chatlog .ch-guild b { color: #7fe27f; } .chatlog .ch-system b { color: var(--ring); } .chatlog .ch-emote b { color: #e6a2ff; }
.chatform { display: flex; gap: 6px; min-width: 0; }
.chatform input { flex: 1; min-width: 0; background: #0d100e; border: 1px solid #2a302b; border-radius: 6px; color: var(--ink); font: 400 11px var(--pixel); padding: 7px 8px; }
.chatform input:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
.chatform button { background: #1d1f1c; color: var(--ink); border: 1px solid #39403a; border-radius: 6px; font: 700 10px var(--pixel); padding: 0 12px; cursor: pointer; }
.build-info { width: min(100%, 380px); box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; padding: 6px 10px; border: 1px solid #39403a; border-radius: 5px; background: #101410; color: #a9b99a; font: 8px/1.5 var(--pixel); letter-spacing: .02em; }
.atlas-btn { background: #1d1f1c; color: #d4e7bd; border: 1px solid #7fa52c; border-radius: 4px; font: 700 9px var(--pixel); padding: 3px 8px; cursor: pointer; letter-spacing: .08em; }
.build-info strong { color: #d4e7bd; font-weight: 700; }
@media (max-height: 640px) { .device { gap: 12px; padding-top: 12px; } #dpad { transform: scale(.85); } }
@media (prefers-reduced-motion: reduce) { .round.down, .pill.down { transform: none; } }
</style>

<aside class="build-info" aria-label="Build information"><span><strong>GB QUEST</strong> v2.1.1</span><span>DEV: ArkansasIo</span><span>ID: GBQ-20261101-004</span><button type="button" data-atlas class="atlas-btn">WORLD ATLAS</button></aside>
<main class="device" aria-label="GB Quest handheld">
  <div class="bezel">
    <div class="bezel-top"><i class="led"></i> BATTERY <span></span> DOT MATRIX</div>
    <canvas id="lcd" width="160" height="144" aria-label="Game screen"></canvas>
  </div>
  <div class="brand">GB <em>QUEST</em></div>
  <div class="controls">
    <div id="dpad" role="group" aria-label="Direction pad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <div class="ab">
      <button class="round" data-btn="b" aria-label="B button"><span>B</span></button>
      <button class="round" data-btn="a" aria-label="A button"><span>A</span></button>
    </div>
  </div>
  <div class="foot">
    <div class="sys">
      <button class="pill" data-btn="select">SELECT</button>
      <button class="pill" data-btn="start">START</button>
    </div>
    <div class="speaker"><b></b><b></b><b></b><b></b><b></b></div>
  </div>
</main>
<section class="chat" aria-label="Chat">
  <div id="chatlog" class="chatlog" aria-live="polite"></div>
  <form id="chatform" class="chatform"><input id="chatinput" maxlength="120" autocomplete="off" placeholder="Say something to players nearby" aria-label="Chat message"><button type="submit">SAY</button></form>
</section>
<p class="keys">Keys: <kbd>arrows</kbd> move · <kbd>Z</kbd> A · <kbd>X</kbd> B/mount · <kbd>Enter</kbd> menu · <kbd>Shift</kbd> map / auto-battle · <kbd>M</kbd> atlas</p>
