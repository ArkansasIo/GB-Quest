map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream gbquest_mmorpg {
  least_conn;
  server mmorpg-1:8788 max_fails=3 fail_timeout=10s;
  server mmorpg-2:8788 max_fails=3 fail_timeout=10s;
  server mmorpg-3:8788 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 8788;
  server_name _;

  client_max_body_size 16k;
  proxy_connect_timeout 5s;
  proxy_read_timeout 75s;
  proxy_send_timeout 30s;

  location / {
    proxy_pass http://gbquest_mmorpg;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
