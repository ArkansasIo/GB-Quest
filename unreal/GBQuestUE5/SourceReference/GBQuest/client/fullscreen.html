<style>
/* Full-screen window build: the LCD fills the window (aspect-locked, pixel-crisp);
   touch controls float over the picture on phones; chat is a toggled overlay. */
html, body { height: 100%; overflow: hidden; }
body { background: #000 !important; padding: 0 !important; display: block !important; gap: 0 !important; }
.build-info, .brand, .bezel-top, .keys, .speaker { display: none !important; }
.game-client { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; min-height: 0 !important; max-width: none !important; margin: 0 !important; padding: 0 !important; background: none !important; border: 0 !important; box-shadow: none !important; }
.game-viewport { position: absolute !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; display: grid !important; place-items: center; }
#lcd { display: block; width: min(100vw, calc(100dvh * 160 / 144)) !important; height: auto; max-width: 100vw; max-height: 100dvh; aspect-ratio: 160 / 144; margin: 0; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
body.int #lcd { width: calc(160px * var(--int, 1)) !important; }
.fsbar { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(8px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; opacity: .35; transition: opacity .2s; }
.fsbar:hover, .fsbar:focus-within, body.idle-off .fsbar { opacity: 1; }
.fsbar button { background: #111c; color: #c9d0b0; border: 1px solid #39403a; border-radius: 4px; font: 700 9px "Silkscreen", "Courier New", monospace; padding: 6px 8px; cursor: pointer; letter-spacing: .08em; }
.fsbar button[aria-pressed="true"] { color: #9fd36a; border-color: #7fa52c; }
.game-viewport > .chat { position: absolute; z-index: 15; left: max(8px, env(safe-area-inset-left, 0px)); right: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); width: min(380px, 42vw) !important; max-height: 38dvh; background: #000d; padding: 8px; border-radius: 5px; }
body.chat-on .game-viewport > .chat { display: flex; }
body:not(.chat-on) .chat { display: none; }
.controls, .foot { position: fixed; z-index: 12; left: 0; right: 0; pointer-events: none; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); display: flex !important; justify-content: space-between; }
.foot { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); justify-content: center !important; }
.controls > *, .foot .sys { pointer-events: auto; opacity: .55; }
@media (hover: hover) and (pointer: fine) { body:not(.pad-on) .controls, body:not(.pad-on) .foot { display: none !important; } }
@media (pointer: coarse) and (orientation: portrait) { .controls > *, .foot .sys { opacity: .9; } .controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); } #dpad { transform: scale(1.35); transform-origin: left bottom; } .ab { transform: rotate(-22deg) scale(1.3); transform-origin: right bottom; } .pill { transform: rotate(-22deg) scale(1.3); } .foot { bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); } .game-viewport > .chat { left: 10px; right: auto; bottom: 10px; width: min(360px, calc(100vw - 20px)) !important; max-height: 36dvh; } }
@media (pointer: coarse) { body.pad-off .controls, body.pad-off .foot { display: none !important; } }
/* ---- SANCTUM theme: black, bronze and blood-red, like a dark action RPG ---- */
:root { --san-bg: #070606; --san-panel: #120e0c; --san-panel2: #1a1411; --san-trim: #765a36; --san-trim-dim: #3a2c1e; --san-gold: #d4ac60; --san-bone: #e8dcc4; --san-dim: #9c8a70; --san-red: #b3241c; --san-blue: #2f5fd0; --san-title: "Cinzel", Georgia, "Times New Roman", serif; }
body { background: var(--san-bg) !important; color: var(--san-bone); }
body::before { background: radial-gradient(ellipse at 45% 38%, #2a1210 0%, #140a09 38%, #050404 100%) !important; }
.build-info { background: linear-gradient(#17110e, #0c0908) !important; border-bottom: 1px solid var(--san-trim) !important; box-shadow: 0 1px 0 #000, 0 2px 0 var(--san-trim-dim), 0 6px 18px rgba(0,0,0,.6); color: var(--san-dim) !important; font-family: var(--san-title) !important; letter-spacing: .08em; }
.build-info strong { color: var(--san-gold) !important; font-family: var(--san-title); font-weight: 700; letter-spacing: .12em; text-shadow: 0 0 8px rgba(212,172,96,.35); }
.atlas-btn, .chatform button, .chat-tabs button { background: linear-gradient(#241a14, #120d0a) !important; color: var(--san-gold) !important; border: 1px solid var(--san-trim) !important; border-radius: 2px !important; font-family: var(--san-title) !important; letter-spacing: .1em; }
.atlas-btn:hover, .chatform button:hover, .chat-tabs button:hover { border-color: var(--san-gold) !important; color: #fff3d2 !important; }
.chat-tabs button[aria-pressed="true"] { background: linear-gradient(#4a1c14, #24100c) !important; color: #ffe6b0 !important; border-color: var(--san-gold) !important; }
.chat, .game-viewport > .chat { background: linear-gradient(rgba(20,14,12,.94), rgba(10,8,7,.94)) !important; border: 1px solid var(--san-trim) !important; border-radius: 2px !important; box-shadow: inset 0 0 0 1px #000, inset 0 0 0 2px var(--san-trim-dim), 0 8px 24px rgba(0,0,0,.7) !important; }
.chat-titlebar { color: var(--san-gold) !important; font-family: var(--san-title) !important; }
.chatlog { background: #0a0807 !important; border: 1px solid var(--san-trim-dim) !important; border-radius: 2px !important; color: var(--san-dim) !important; }
.chatlog b { color: var(--san-bone) !important; }
.chatform input { background: #0a0807 !important; border: 1px solid var(--san-trim-dim) !important; border-radius: 2px !important; color: var(--san-bone) !important; }
.chatform input:focus { outline: 1px solid var(--san-gold) !important; }
.keys { background: linear-gradient(#0c0908, #16100d) !important; border-top: 1px solid var(--san-trim) !important; color: var(--san-dim) !important; }
.keys kbd { color: var(--san-gold) !important; border-color: var(--san-trim) !important; background: #120d0a; }
#lcd { box-shadow: 0 0 0 1px #000, 0 0 0 3px var(--san-trim), 0 0 0 4px #000, 0 0 40px rgba(140,30,20,.25) !important; }
.game-start-fallback { background: var(--san-bg) !important; color: var(--san-gold) !important; font-family: var(--san-title) !important; }
.device { background: linear-gradient(160deg, #241a14, #120d0a 45%, #070505) !important; }
.bezel { background: #050404 !important; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--san-trim) !important; }
.round { background: radial-gradient(circle at 35% 30%, #5a2018, #2c0e0b 60%, #120605) !important; color: var(--san-gold) !important; box-shadow: 0 4px 0 #000, 0 0 0 2px var(--san-trim) !important; }
.pill { background: #160f0c !important; color: var(--san-gold) !important; box-shadow: 0 3px 0 #000, 0 0 0 1px var(--san-trim) !important; }
.game-viewport > .chat, body.full-window-mode .game-viewport > .chat, body.fullscreen-mode .game-viewport > .chat { bottom: 19% !important; }
#dpad::before, #dpad::after { background: #1a1210 !important; box-shadow: inset 0 2px 0 rgba(212,172,96,.15), 0 3px 0 #000 !important; }
</style>
<div class="fsbar" role="toolbar" aria-label="Window">
  <button id="fsPad" title="On-screen pad">PAD</button>
  <button id="fsInt" title="Whole-number pixel scaling">1:1 PIXELS</button>
  <button data-atlas title="World atlas (M)">ATLAS</button>
  <button id="fsChat" title="Chat (C)">CHAT</button>
  <button id="fsFull" title="Full screen (F)">FULL SCREEN</button>
</div>
<script>
(() => {
  const B = document.body, $ = id => document.getElementById(id);
  const pref = k => { try { return localStorage.getItem('gbq.fs.' + k); } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem('gbq.fs.' + k, v); } catch (e) {} };
  const coarse = matchMedia('(pointer: coarse)').matches;
  const fit = () => { const n = Math.max(1, Math.floor(Math.min(innerWidth / 160, innerHeight / 144))); B.style.setProperty('--int', n); };
  addEventListener('resize', fit); fit();
  const tog = (btn, cls, key, on) => { const set = v => { B.classList.toggle(cls, v); btn.setAttribute('aria-pressed', v); save(key, v ? 1 : 0); };
    set(on); btn.onclick = () => set(!B.classList.contains(cls)); return set; };
  const padBtn = $('fsPad');
  if (coarse) tog(padBtn, 'pad-off', 'padoff', pref('padoff') === '1'), padBtn.setAttribute('aria-pressed', !B.classList.contains('pad-off')), padBtn.addEventListener('click', () => padBtn.setAttribute('aria-pressed', !B.classList.contains('pad-off')));
  else tog(padBtn, 'pad-on', 'pad', pref('pad') === '1');
  tog($('fsInt'), 'int', 'int', pref('int') === '1');
  const chat = tog($('fsChat'), 'chat-on', 'chat', pref('chat') !== '0');
  const full = $('fsFull'), el = document.documentElement;
  const canFS = !!(el.requestFullscreen || el.webkitRequestFullscreen);
  if (!canFS) full.hidden = true;
  const toggleFS = () => { try { if (typeof applyDisplayMode === 'function') { applyDisplayMode(document.fullscreenElement || document.webkitFullscreenElement ? 'borderless' : 'fullscreen'); return; }
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(() => { full.hidden = true; }); } } catch (e) { full.hidden = true; } };
  full.onclick = toggleFS;
  document.addEventListener('fullscreenchange', () => full.setAttribute('aria-pressed', !!document.fullscreenElement));
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') toggleFS(); else if (e.key === 'c' || e.key === 'C') chat(!B.classList.contains('chat-on')); });
})();
</script>
