 <g id="tree"><path d="M15 3 4 18h7L5 26h22l-6-8h7z" fill="#527b59" stroke="#b4d49a"/><path d="M14 24h4v6h-4z" fill="#8a5b42"/></g>
 <g id="mountain"><path d="m2 27 10-18 5 8 5-12 9 22z" fill="#526b73" stroke="#dce9e6"/><path d="m17 17 5-12 5 9-5-2-3 4z" fill="#f4e9c8"/></g>
 <g id="flame"><path d="M16 2Q20 12 26 15q3 12-10 15Q2 29 5 17q6-5 6-11 4 4 5 9z" fill="#b45b50" stroke="#e6c16a"/><path d="M16 16q5 6 2 12-8 0-6-7z" fill="#f4e9c8"/></g>
 <g id="moon"><path d="M24 5Q8 4 8 17t16 11Q5 34 3 17 4 2 24 5z" fill="#e6c16a"/><path d="M22 7q-6 5-4 12 2 5 8 6-13 5-17-7-2-9 13-11z" fill="#f4e9c8"/></g>
 <g id="skull"><path d="M6 13Q6 3 16 3t10 10q0 7-5 10v5h-3v-4h-4v4h-3v-5q-5-3-5-10z" fill="#d9d6c8"/><path d="M10 13h4v4h-4zm8 0h4v4h-4z" fill="#101629"/><path d="M14 20h4v4h-4z" fill="#b45b50"/></g>
</defs>
<rect width="512" height="384" fill="#0a1020"/>
<g font-family="monospace" font-size="9" fill="#f4e9c8">
 <text x="8" y="12">CLASS &amp; CHARACTER</text>
 <text x="8" y="108">WEAPONS &amp; ARMOR</text>
 <text x="8" y="204">MAGIC &amp; MATERIALS</text>
