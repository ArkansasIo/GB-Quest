 <g id="potion"><path d="M12 4h8v5l5 5v12q-9 7-18 0V14l5-5z" fill="#7254a3" stroke="#f4e9c8"/><path d="M8 19h16v7q-8 5-16 0z" fill="#b45b50"/><path d="M12 3h8v4h-8z" fill="#e6c16a"/></g>
