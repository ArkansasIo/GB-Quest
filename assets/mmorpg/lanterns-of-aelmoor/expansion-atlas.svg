<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384" shape-rendering="crispEdges">
<title>GB Quest Lanterns of Aelmoor pixel-art expansion atlas</title>
<desc>Original 32 pixel grid icons for classes, weapons, armor, magic, materials and biomes.</desc>
<defs>
 <g id="tile"><rect width="32" height="32" rx="3" fill="#101629" stroke="#526b73"/></g>
 <g id="sword"><path d="M7 25 22 6l4 2-14 19-3 1z" fill="#d8e6df"/><path d="m21 7 4-4 4 4-4 4z" fill="#e6c16a"/><path d="m6 24 6 5-3 2-5-5z" fill="#8a5b42"/></g>
 <g id="shield"><path d="M16 3 27 7v9q-1 9-11 14Q6 25 5 16V7z" fill="#b68b45" stroke="#f4e9c8"/><path d="M16 7v18q7-4 7-10V9z" fill="#27334b"/><path d="M16 7v18q-7-4-7-10V9z" fill="#526b73"/></g>
